<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sito in configurazione</title>
<meta name="description" content="Stiamo configurando qualcosa di nuovo. Torna presto.">
<style>
  :root {
    --bg: #07080f;
    --fg: #e8eaf6;
    --muted: #8b90b0;
    --a: #7c5cff;
    --b: #00d4ff;
    --c: #ff4fd8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    overflow: hidden;
    display: grid;
    place-items: center;
  }

  /* sfondo: blob sfumati animati */
  .blob {
    position: fixed;
    width: 55vmax; height: 55vmax;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .35;
    animation: float 18s ease-in-out infinite;
    z-index: 0;
  }
  .b1 { background: var(--a); top: -20vmax; left: -15vmax; }
  .b2 { background: var(--b); bottom: -25vmax; right: -15vmax; animation-delay: -6s; }
  .b3 { background: var(--c); top: 30%; left: 45%; width: 35vmax; height: 35vmax; opacity: .18; animation-delay: -12s; }
  @keyframes float {
    0%,100% { transform: translate(0,0) scale(1); }
    33%     { transform: translate(6vmax,4vmax) scale(1.1); }
    66%     { transform: translate(-4vmax,6vmax) scale(.95); }
  }

  /* griglia sottile */
  .grid {
    position: fixed; inset: 0; z-index: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
  }

  canvas { position: fixed; inset: 0; z-index: 1; }

  main {
    position: relative; z-index: 2;
    text-align: center;
    padding: 2.5rem 1.5rem;
    max-width: 760px;
    width: 100%;
  }

  .card {
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 28px;
    padding: 3.2rem 2rem 2.6rem;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 30px 80px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08);
    animation: rise .9s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(28px); } }

  .gear {
    width: 84px; height: 84px; margin: 0 auto 1.6rem;
    color: var(--b);
    filter: drop-shadow(0 0 18px rgba(0,212,255,.55));
  }
  .gear .big   { transform-origin: 32px 32px; animation: spin 9s linear infinite; }
  .gear .small { transform-origin: 62px 62px; animation: spin 6s linear infinite reverse; color: var(--c); }
  @keyframes spin { to { transform: rotate(360deg); } }

  .badge {
    display: inline-flex; align-items: center; gap: .55rem;
    font-size: .78rem; letter-spacing: .18em; text-transform: uppercase;
    color: var(--muted);
    padding: .45rem .95rem;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 999px;
    background: rgba(255,255,255,.03);
    margin-bottom: 1.4rem;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #3dffa0; box-shadow: 0 0 10px #3dffa0;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .3; transform: scale(.7); } }

  h1 {
    font-size: clamp(2.2rem, 7vw, 4.2rem);
    line-height: 1.05;
    font-weight: 800;
    letter-spacing: -.03em;
    background: linear-gradient(110deg, var(--a), var(--b) 45%, var(--c) 90%);
    background-size: 200% auto;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    animation: shine 6s linear infinite;
  }
  @keyframes shine { to { background-position: 200% center; } }

  .sub {
    margin: 1.2rem auto 0;
    max-width: 30em;
    color: var(--muted);
    font-size: clamp(1rem, 2.4vw, 1.2rem);
    line-height: 1.6;
  }
  .typing { color: var(--fg); border-right: 2px solid var(--b); padding-right: 3px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { border-color: transparent; } }

  .bar {
    margin: 2.2rem auto 0;
    width: min(420px, 100%);
    height: 8px; border-radius: 99px;
    background: rgba(255,255,255,.08);
    overflow: hidden;
  }
  .bar i {
    display: block; height: 100%; width: 68%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--a), var(--b), var(--c));
    background-size: 200% 100%;
    animation: shine 3s linear infinite, grow 2.4s ease-out both;
    box-shadow: 0 0 16px rgba(124,92,255,.7);
  }
  @keyframes grow { from { width: 0; } }
  .pct { margin-top: .7rem; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }

  footer { margin-top: 1.6rem; font-size: .8rem; color: #5d6285; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
    canvas { display: none; }
  }
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="grid"></div>
  <canvas id="stars" aria-hidden="true"></canvas>

  <main>
    <section class="card">
      <svg class="gear" viewBox="0 0 90 90" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <g class="big">
          <circle cx="32" cy="32" r="9"/>
          <path d="M32 8v8M32 48v8M8 32h8M48 32h8M15 15l6 6M43 43l6 6M49 15l-6 6M21 43l-6 6"/>
          <circle cx="32" cy="32" r="17"/>
        </g>
        <g class="small">
          <circle cx="62" cy="62" r="5"/>
          <path d="M62 49v5M62 70v5M49 62h5M70 62h5M53 53l3.5 3.5M67.5 67.5L71 71M71 53l-3.5 3.5M56.5 67.5L53 71"/>
          <circle cx="62" cy="62" r="10"/>
        </g>
      </svg>

      <div class="badge"><span class="dot"></span> Work in progress</div>

      <h1>Sito in<br>configurazione</h1>

      <p class="sub">
        Stiamo mettendo a punto qualcosa di nuovo.<br>
        <span class="typing" id="typing"></span>
      </p>

      <div class="bar" role="progressbar" aria-valuenow="68" aria-valuemin="0" aria-valuemax="100" aria-label="Avanzamento lavori"><i></i></div>
      <div class="pct"><span id="pct">0</span>% completato</div>

      <footer>&copy; <span id="year"></span> &middot; Torna a trovarci presto</footer>
    </section>
  </main>

<script>
  // anno nel footer
  document.getElementById('year').textContent = new Date().getFullYear();

  // percentuale che sale
  (function () {
    const el = document.getElementById('pct'), target = 68, t0 = performance.now(), dur = 2400;
    (function tick(t) {
      const p = Math.min((t - t0) / dur, 1);
      el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(tick);
    })(t0);
  })();

  // effetto macchina da scrivere
  (function () {
    const phrases = ['Nuovo design in arrivo…', 'Ultimi ritocchi in corso…', 'Torniamo online a breve…'];
    const el = document.getElementById('typing');
    let i = 0, j = 0, del = false;
    (function step() {
      const s = phrases[i];
      el.textContent = s.slice(0, j);
      if (!del && j === s.length) { del = true; return setTimeout(step, 1600); }
      if (del && j === 0) { del = false; i = (i + 1) % phrases.length; }
      j += del ? -1 : 1;
      setTimeout(step, del ? 28 : 65);
    })();
  })();

  // particelle / stelle con effetto parallasse sul mouse
  (function () {
    const c = document.getElementById('stars'), ctx = c.getContext('2d');
    let w, h, dpr, stars = [], mx = 0, my = 0;
    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = c.width = innerWidth * dpr; h = c.height = innerHeight * dpr;
      c.style.width = innerWidth + 'px'; c.style.height = innerHeight + 'px';
      const n = Math.round((innerWidth * innerHeight) / 11000);
      stars = Array.from({ length: n }, () => ({
        x: Math.random() * w, y: Math.random() * h,
        r: (Math.random() * 1.4 + .3) * dpr,
        v: Math.random() * .25 + .05,
        d: Math.random() * .8 + .2,
        t: Math.random() * Math.PI * 2
      }));
    }
    addEventListener('resize', resize); resize();
    addEventListener('pointermove', e => {
      mx = (e.clientX / innerWidth - .5); my = (e.clientY / innerHeight - .5);
    });
    (function draw() {
      ctx.clearRect(0, 0, w, h);
      for (const s of stars) {
        s.y -= s.v * dpr; s.t += .02;
        if (s.y < -5) { s.y = h + 5; s.x = Math.random() * w; }
        const x = s.x + mx * 40 * s.d * dpr, y = s.y + my * 40 * s.d * dpr;
        ctx.globalAlpha = .35 + Math.sin(s.t) * .3 * s.d;
        ctx.fillStyle = '#cfd6ff';
        ctx.beginPath(); ctx.arc(x, y, s.r, 0, Math.PI * 2); ctx.fill();
      }
      requestAnimationFrame(draw);
    })();
  })();
</script>
</body>
</html>
